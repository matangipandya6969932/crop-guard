<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropGuard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div class="logo">🌱 CropGuard</div>
    <p>Offline AI Plant Disease Identification</p>

    <!-- Upload Button -->
    <button id="uploadBtn" onclick="document.getElementById('imageInput').click()">
      📷 Take Photo or Upload
    </button>

    <!-- Hidden File Input -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <!-- Preview Container -->
    <div id="previewContainer">
      <img id="preview" src="" alt="Selected Leaf" style="display: none; max-width: 100%; margin-top: 20px; border-radius: 10px;">
    </div>

    <!-- Results Container -->
    <div id="result" style="margin-top: 20px; font-weight: bold; font-size: 1.1rem;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
