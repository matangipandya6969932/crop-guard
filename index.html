<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropGuard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <!-- TensorFlow.js Core & TFLite Support -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌱 CropGuard</h1>
      <p>Offline AI Plant Disease Identification</p>
    </header>

    <button id="uploadBtn" type="button">📷 Take Photo or Upload</button>
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <div id="previewContainer" style="margin-top: 20px;">
      <img id="imagePreview" src="" alt="Selected Leaf" style="display: none; max-width: 100%; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    </div>

    <div id="result" style="margin-top: 20px;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
