<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropGuard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌱 CropGuard</h1>
      <p>Offline AI Plant Disease Identification</p>
    </header>

    <!-- Upload Button -->
    <button id="uploadBtn" type="button">📷 Take Photo or Upload</button>

    <!-- Hidden File Input -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <!-- Image Preview Area -->
    <div id="previewContainer" style="margin-top: 20px;">
      <img id="imagePreview" src="" alt="Selected Leaf" style="display: none; max-width: 100%; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    </div>

    <!-- Diagnostic Results Display -->
    <div id="result" style="margin-top: 20px; font-weight: bold; font-size: 1.1rem; text-align: center;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
